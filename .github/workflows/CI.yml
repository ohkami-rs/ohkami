name: CI

on:
  pull_request:
  push:
    branches: ['main', 'v*']

permissions: {}

jobs:
  CI:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain: ['stable', 'nightly']
        task: ['check', 'test:core', 'test:other', 'bench:dryrun']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Cache sccahe dir
        id:   cahce_sccahe_dir
        # cache sccache directory after the most large task
        # in order to maximize cache hit
        if:   ${{ matrix.task == 'test:other' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key:  ${{ runner.os }}-sccahe-dir
          path: ~/.cache/sccache
      - name: Run tasks
        shell:
          nix develop --command bash -euo pipefail {0}
        run:  |
          RUSTC_WRAPPER="$(which sccache)" task ${{ matrix.task }}
